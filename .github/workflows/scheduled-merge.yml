name: Scheduled PR Auto-Merge

on:
  schedule:
    # 07:00 UTC on October 16 = 00:00 (midnight) PDT on October 16
    - cron: '0 7 16 10 *'
  # Allows you to test or trigger it manually from the Actions tab
  workflow_dispatch:

jobs:
  merge-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR #1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: 1
        run: |
          gh pr merge $PR_NUMBER --merge --repo ${{ github.repository }}
          
