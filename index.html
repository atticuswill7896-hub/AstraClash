<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AstraClash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      font-family: Consolas, monospace;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #gameCanvas {
      background-color: rgb(10, 10, 25);
      image-rendering: pixelated;
    }
    .touch-ui {
      position: fixed;
      z-index: 99;
      pointer-events: auto;
      display: none;
    }
    .d-pad {
      bottom: 20px;
      left: 20px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
    }
    .action-pad {
      bottom: 25px;
      right: 20px;
      display: flex;
      gap: 12px;
    }
    .upgrade-pad {
      top: 70px;
      right: 20px;
      display: flex;
      gap: 10px;
    }
    .t-btn {
      background: rgba(20, 30, 50, 0.75);
      border: 2px solid #00ffff;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .t-btn:active {
      background: rgba(0, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1000" height="600"></canvas>

  <div class="touch-ui d-pad" id="group-dpad">
    <div></div>
    <div class="t-btn" id="btn-up">▲</div>
    <div></div>
    <div class="t-btn" id="btn-left">◀</div>
    <div></div>
    <div class="t-btn" id="btn-right">▶</div>
  </div>

  <div class="touch-ui action-pad" id="group-action">
    <div class="t-btn" style="width: 65px; height: 65px; border-color: #ff3c3c;" id="btn-fire">FIRE</div>
    <div class="t-btn" style="width: 55px; height: 55px;" id="btn-auto">AI (E)</div>
  </div>

  <div class="touch-ui upgrade-pad" id="group-upgrade">
    <div class="t-btn" style="width: 42px; height: 42px;" id="btn-1">1</div>
    <div class="t-btn" style="width: 42px; height: 42px;" id="btn-2">2</div>
    <div class="t-btn" style="width: 42px; height: 42px;" id="btn-3">3</div>
  </div>

  <script>
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia("(pointer: coarse)").matches;
    if (isTouchDevice) {
      document.getElementById("group-dpad").style.display = "grid";
      document.getElementById("group-action").style.display = "flex";
      document.getElementById("group-upgrade").style.display = "flex";
    }

    const V_WIDTH = 1000;
    const V_HEIGHT = 600;
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const virtualCanvas = document.createElement("canvas");
    virtualCanvas.width = V_WIDTH;
    virtualCanvas.height = V_HEIGHT;
    const vctx = virtualCanvas.getContext("2d");

    let canvasScale = 1;

    function resizeWindow() {
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      canvasScale = Math.min(winW / V_WIDTH, winH / V_HEIGHT);
      canvas.width = Math.floor(V_WIDTH * canvasScale);
      canvas.height = Math.floor(V_HEIGHT * canvasScale);
    }
    window.addEventListener("resize", resizeWindow);
    resizeWindow();

    function getCanvasMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) / canvasScale,
        y: (e.clientY - rect.top) / canvasScale
      };
    }

    const RAINBOW = {
      1: "rgb(255, 60, 60)",
      2: "rgb(255, 140, 30)",
      3: "rgb(255, 220, 50)",
      4: "rgb(50, 255, 80)",
      5: "rgb(30, 140, 255)",
      6: "rgb(190, 70, 255)"
    };

    const BLACK = "rgb(10, 10, 25)";
    const WHITE = "rgb(255, 255, 255)";
    const CYAN = "rgb(0, 255, 255)";
    const GRAY = "rgb(140, 140, 150)";
    const DARK_GRAY = "rgb(45, 50, 65)";
    const XP_BG = "rgb(20, 30, 50)";
    const XP_BLUE = "rgb(0, 180, 255)";
    const ORE_BLUE = "rgb(0, 215, 255)";
    const ASTEROID_COLOR = "rgb(115, 110, 125)";
    const ORE_ASTEROID_COLOR = "rgb(70, 95, 130)";
    const PANEL_BG = "rgb(15, 18, 32)";
    const BORDER_COLOR = "rgb(0, 180, 255)";

    const BASE_MOVE_SPEED = 5.0;
    const BASE_ROT_SPEED = 4.0;
    const WORLD_BOUND = 2000;
    const ASTEROID_COUNT = 85;
    const SHIP_SIZE = 20;

    const UPGRADE_TREE = {
      root: { children: ["twin_cannons", "heavy_armor", "tractor_core"] },
      twin_cannons: {
        name: "Twin Cannons",
        desc: "Fire 2 parallel lasers",
        children: ["rapid_fire", "railgun"],
        apply: (p) => { p.cannons = 2; }
      },
      rapid_fire: {
        name: "Gatling Laser",
        desc: "Twice the fire rate",
        children: ["spread_burst", "homing_blasts"],
        apply: (p) => { p.cooldown_max = 0.11; }
      },
      spread_burst: {
        name: "Spread Burst",
        desc: "Fires a 3-way laser shotgun spread",
        children: ["rear_cannon", "heavy_slugs"],
        apply: (p) => { p.spread_shot = true; }
      },
      heavy_slugs: {
        name: "High-Caliber Slugs",
        desc: "Shots deal heavy impact damage",
        children: ["hyper_homing"],
        apply: (p) => { p.shot_damage = 2; }
      },
      railgun: {
        name: "Piercing Beam",
        desc: "Lasers punch through asteroids",
        children: ["prism_splitter", "heavy_slugs"],
        apply: (p) => { p.piercing = true; }
      },
      rear_cannon: {
        name: "Rear Defense",
        desc: "Fires an extra laser backwards",
        children: ["mine_layer"],
        apply: (p) => { p.rear_cannon = true; }
      },
      prism_splitter: {
        name: "Prism Splitter",
        desc: "Lasers deal bonus damage",
        children: ["super_prism"],
        apply: (p) => { p.shot_damage = 2; }
      },
      homing_blasts: {
        name: "Hunter Torpedoes",
        desc: "Fires seeking missile torpedoes",
        children: ["hyper_homing"],
        apply: (p) => {
          p.laser_speed = 13.0;
          p.is_missile = true;
        }
      },
      hyper_homing: {
        name: "Predator Swarm",
        desc: "Devastating double missile damage",
        children: ["autopilot"],
        apply: (p) => {
          p.shot_damage = 3;
          p.is_missile = true;
          p.laser_speed = 15.0;
        }
      },
      super_prism: {
        name: "Refraction Field",
        desc: "Split lasers pierce and shred",
        children: ["autopilot"],
        apply: (p) => { p.piercing = true; p.shot_damage = 3; }
      },
      heavy_armor: {
        name: "Heavy Plating",
        desc: "Max HP boosted to 12",
        children: ["battering_ram", "afterburners"],
        apply: (p) => { p.max_hp = 12; p.hp = 12; }
      },
      battering_ram: {
        name: "Battering Ram",
        desc: "Heavy shove on asteroid contact",
        children: ["reactive_hull", "mine_layer"],
        apply: (p) => { p.ram_power = 3.8; }
      },
      reactive_hull: {
        name: "Reactive Armor",
        desc: "Max HP boosted to 14",
        children: ["reinforced_bulkheads"],
        apply: (p) => { p.max_hp = 14; p.hp = 14; }
      },
      reinforced_bulkheads: {
        name: "Reinforced Bulkheads",
        desc: "Boosts hull durability to 18 HP",
        children: ["barrier_blast"],
        apply: (p) => { p.max_hp = 18; p.hp = 18; }
      },
      afterburners: {
        name: "Afterburners",
        desc: "Speed boosted by +40%",
        children: ["ion_wake", "mine_layer"],
        apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.4; }
      },
      ion_wake: {
        name: "Ion Wake",
        desc: "Further boosts engine speed by +20%",
        children: ["plasma_overdrive"],
        apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.6; }
      },
      mine_layer: {
        name: "Cluster Mines",
        desc: "Increases max HP and armor",
        children: ["nuke_mines"],
        apply: (p) => { p.max_hp += 2; p.hp += 2; }
      },
      barrier_blast: {
        name: "Aegis Overload",
        desc: "Titan hull upgraded to 22 HP",
        children: ["autopilot"],
        apply: (p) => { p.max_hp = 22; p.hp = 22; }
      },
      plasma_overdrive: {
        name: "Plasma Tempest",
        desc: "Speed boosted by +80%",
        children: ["autopilot"],
        apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.8; }
      },
      nuke_mines: {
        name: "Seismic Core",
        desc: "Max HP boosted by +6",
        children: ["autopilot"],
        apply: (p) => { p.max_hp += 6; p.hp += 6; }
      },
      tractor_core: {
        name: "Tractor Core",
        desc: "3x magnet range & faster collection",
        children: ["ore_transmuter", "slingshot_tether"],
        apply: (p) => { p.magnet_range = 350; p.orb_accel = 0.18; }
      },
      ore_transmuter: {
        name: "Ore Transmuter",
        desc: "+50% XP from all blue ores",
        children: ["ore_siphon", "mine_layer"],
        apply: (p) => { p.xp_mult = 1.5; }
      },
      ore_siphon: {
        name: "Ore Siphon",
        desc: "Ores yield +100% more Ore Mana",
        children: ["auxiliary_battery"],
        apply: (p) => { p.mana_mult = 2.0; }
      },
      auxiliary_battery: {
        name: "Auxiliary Battery",
        desc: "Increases max Ore Mana by +60",
        children: ["singularity_core"],
        apply: (p) => { p.max_mana = 160.0; p.mana += 60.0; }
      },
      slingshot_tether: {
        name: "Slingshot Core",
        desc: "Turning agility doubled",
        children: ["gravity_repulsor"],
        apply: (p) => { p.rot_speed = BASE_ROT_SPEED * 1.8; }
      },
      gravity_repulsor: {
        name: "Gravity Repulsor",
        desc: "+30% thrust speed",
        children: ["singularity_core"],
        apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.3; }
      },
      singularity_core: {
        name: "Singularity Core",
        desc: "Massive screen-wide magnet range",
        children: ["autopilot"],
        apply: (p) => { p.magnet_range = 800; p.orb_accel = 0.28; p.move_speed = BASE_MOVE_SPEED * 1.5; }
      },
      autopilot: {
        name: "Autonomous AI Core",
        desc: "Unlocks Ore Mana auto-aim and steering (E)",
        children: [],
        apply: (p) => { p.has_autopilot = true; p.autopilot_active = false; p.mana = Math.max(p.mana, 60.0); }
      }
    };

    const TIER_XP_THRESHOLDS = [0, 80, 180, 300, 440, 600];

    const stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * V_WIDTH,
        y: Math.random() * V_HEIGHT,
        speed: 0.5 + Math.random() * 1.3
      });
    }

    function drawStarfield(targetCtx, w, h) {
      for (const s of stars) {
        s.y = (s.y + s.speed * 0.3) % h;
        s.x = (s.x + s.speed * 0.08) % w;
        const val = Math.floor(Math.min(255, s.speed * 120));
        targetCtx.fillStyle = `rgb(${val}, ${val}, ${val + 15})`;
        targetCtx.beginPath();
        targetCtx.arc(s.x, s.y, s.speed, 0, Math.PI * 2);
        targetCtx.fill();
      }
    }

    function drawCard(targetCtx, x, y, w, h, borderCol = CYAN) {
      targetCtx.fillStyle = PANEL_BG;
      targetCtx.fillRect(x, y, w, h);
      targetCtx.strokeStyle = borderCol;
      targetCtx.lineWidth = 2;
      targetCtx.strokeRect(x, y, w, h);
    }

    const RENDER_URL = "wss://astraclash-howt.onrender.com";
    let ws = null;
    let menuMode = "main";
    let statusMessage = "Connecting to matchmaking server...";
    let statusColor = RAINBOW[3];

    let roomCodeInput = "";
    let passwordInput = "";
    let activeInput = "code";

    let myId = 1;
    let roomCode = "";
    let inLobby = true;

    function connectWs() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return true;
      try {
        ws = new WebSocket(RENDER_URL);
        statusMessage = "Connecting to Render...";
        statusColor = RAINBOW[3];

        ws.onopen = () => {
          statusMessage = "Connected to Render. Choose game mode.";
          statusColor = RAINBOW[4];
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            handleNetworkMessage(msg);
          } catch(e) {}
        };

        ws.onerror = () => {
          statusMessage = "Connection failed. Retrying...";
          statusColor = RAINBOW[1];
        };

        ws.onclose = () => {
          statusMessage = "Disconnected from server.";
          statusColor = RAINBOW[1];
        };
        return true;
      } catch (err) {
        statusMessage = "Error connecting to cloud.";
        statusColor = RAINBOW[1];
        return false;
      }
    }

    function sendMsg(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }
    }

    function handleNetworkMessage(msg) {
      const action = msg.action;
      const status = msg.status;

      if (inLobby) {
        if (action === "player_joined" || (menuMode === "waiting" && action === "player_joined")) {
          inLobby = false;
        } else if (status === "ok") {
          if (msg.player_id !== undefined) myId = Number(msg.player_id);
          if (msg.room_code !== undefined) roomCode = msg.room_code;
          initMyShip();

          if (msg.rooms !== undefined) {
            const rooms = msg.rooms;
            if (rooms.length > 0) {
              sendMsg({ action: "join_room", room_code: rooms[0], password: null });
              statusMessage = "Joining public arena...";
            } else {
              sendMsg({ action: "create_room", public: true, password: null });
              statusMessage = "Created public room. Waiting for pilots...";
              menuMode = "waiting";
            }
          } else if (menuMode === "waiting") {
            statusMessage = `Room [${roomCode}] open. Waiting for pilots (Max 6)...`;
          } else if (myId > 1) {
            inLobby = false;
          }
        } else if (status === "error") {
          statusMessage = msg.msg || "Action failed.";
          statusColor = RAINBOW[1];
          menuMode = "main";
        }
      }

      if (action === "game_packet") {
        inLobby = false;
        const payload = msg.payload;
        if (!payload) return;

        if (payload.ship && payload.ship.id !== undefined) {
          const sId = Number(payload.ship.id);
          if (sId !== myId) {
            remoteShips[sId] = payload.ship;
            if (payload.ship.alive !== undefined) {
              remoteShips[sId].alive = Boolean(payload.ship.alive);
            } else if (payload.ship.hp > 0) {
              remoteShips[sId].alive = true;
            }
          }
        }

        if (payload.hit_target !== undefined && Number(payload.hit_target) === myId) {
          if (myShip.alive) {
            myShip.hp = Math.max(0, myShip.hp - (payload.dmg || 1));
            if (myShip.hp <= 0) {
              myShip.alive = false;
              myShip.hp = 0;
              myShip.respawn_timer = 10.0;
              myShip.autopilot_active = false;
            }
          }
        }

        if (myId !== 1) {
          if (payload.asteroids) asteroids = payload.asteroids;
          if (payload.ores) ores = payload.ores;
        }

        if (payload.new_lasers && Array.isArray(payload.new_lasers)) {
          for (const rL of payload.new_lasers) {
            if (Number(rL.owner) !== myId) {
              lasers.push(rL);
            }
          }
        }
      } else if (action === "player_left") {
        delete remoteShips[Number(msg.player_id)];
      }
    }

    connectWs();

    let myShip = null;
    const remoteShips = {};
    let lasers = [];
    let ores = [];
    let asteroids = [];

    function initMyShip() {
      const angleOffset = (myId - 1) * (360.0 / 6);
      const spawnRad = (angleOffset * Math.PI) / 180;
      myShip = {
        id: myId,
        world_x: 400.0 * Math.cos(spawnRad),
        world_y: 400.0 * Math.sin(spawnRad),
        vx: 0.0,
        vy: 0.0,
        angle: (angleOffset + 180.0) % 360.0,
        color: RAINBOW[myId] || RAINBOW[1],
        hp: 6,
        max_hp: 6,
        alive: true,
        respawn_timer: 0,
        xp: 0,
        tier: 0,
        current_node: "root",
        mana: 25.0,
        max_mana: 100.0,
        mana_mult: 1.0,
        xp_mult: 1.0,
        has_autopilot: false,
        autopilot_active: false,
        move_speed: BASE_MOVE_SPEED,
        rot_speed: BASE_ROT_SPEED,
        cannons: 1,
        cooldown_max: 0.20,
        spread_shot: false,
        rear_cannon: false,
        shot_damage: 1,
        piercing: false,
        laser_speed: 14.0,
        is_missile: false,
        magnet_range: 160,
        orb_accel: 0.09,
        ram_power: 1.0,
        cooldown: 0.0
      };
    }
    initMyShip();

    function createAsteroid(idx) {
      const is_ore = Math.random() < 0.25;
      return {
        id: idx,
        x: -WORLD_BOUND + 150 + Math.random() * (WORLD_BOUND * 2 - 300),
        y: -WORLD_BOUND + 150 + Math.random() * (WORLD_BOUND * 2 - 300),
        vx: -0.8 + Math.random() * 1.6,
        vy: -0.8 + Math.random() * 1.6,
        r: is_ore ? 26 + Math.floor(Math.random() * 22) : 22 + Math.floor(Math.random() * 22),
        hp: is_ore ? 6 : 4,
        max_hp: is_ore ? 6 : 4,
        is_ore: is_ore
      };
    }

    function initAsteroids() {
      asteroids = [];
      for (let i = 0; i < ASTEROID_COUNT; i++) {
        asteroids.push(createAsteroid(i));
      }
    }
    initAsteroids();

    function spawnOreCluster(x, y, count) {
      for (let i = 0; i < count; i++) {
        ores.push({
          x: Math.max(-WORLD_BOUND + 40, Math.min(WORLD_BOUND - 40, x + (-16 + Math.random() * 32))),
          y: Math.max(-WORLD_BOUND + 40, Math.min(WORLD_BOUND - 40, y + (-16 + Math.random() * 32)))
        });
      }
    }

    const keysDown = {};
    let mousePos = { x: 0, y: 0 };
    let mouseClicked = false;

    window.addEventListener("mousemove", (e) => {
      mousePos = getCanvasMousePos(e);
    });

    window.addEventListener("mousedown", (e) => {
      if (e.button === 0) mouseClicked = true;
    });

    window.addEventListener("keydown", (e) => {
      keysDown[e.code] = true;

      if (inLobby) {
        if (menuMode === "host_private" || menuMode === "join_private") {
          if (e.key === "Backspace") {
            if (activeInput === "code") roomCodeInput = roomCodeInput.slice(0, -1);
            else passwordInput = passwordInput.slice(0, -1);
          } else if (e.key === "Tab") {
            e.preventDefault();
            activeInput = activeInput === "code" ? "pass" : "code";
          } else if (e.key.length === 1) {
            if (activeInput === "code" && roomCodeInput.length < 4) {
              roomCodeInput += e.key.toUpperCase();
            } else if (activeInput === "pass" && passwordInput.length < 16) {
              passwordInput += e.key;
            }
          }
        }
      } else {
        if (e.code === "KeyE") {
          if (myShip.has_autopilot && myShip.mana > 0 && myShip.alive) {
            myShip.autopilot_active = !myShip.autopilot_active;
          } else {
            myShip.autopilot_active = false;
          }
        }

        const currentNode = myShip.current_node;
        const options = UPGRADE_TREE[currentNode]?.children || [];
        const nextTier = myShip.tier + 1;

        if (options.length > 0 && nextTier < TIER_XP_THRESHOLDS.length && myShip.xp >= TIER_XP_THRESHOLDS[nextTier]) {
          let chosenIdx = null;
          if (e.code === "Digit1" && options.length >= 1) chosenIdx = 0;
          if (e.code === "Digit2" && options.length >= 2) chosenIdx = 1;
          if (e.code === "Digit3" && options.length >= 3) chosenIdx = 2;

          if (chosenIdx !== null) {
            const nodeKey = options[chosenIdx];
            myShip.tier = nextTier;
            myShip.current_node = nodeKey;
            UPGRADE_TREE[nodeKey].apply(myShip);
          }
        }
      }
    });

    window.addEventListener("keyup", (e) => {
      keysDown[e.code] = false;
    });

    function bindTouch(id, keyName, isPressEvent = false) {
      const el = document.getElementById(id);
      if (!el) return;

      el.addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (isPressEvent) {
          window.dispatchEvent(new KeyboardEvent("keydown", { code: keyName, key: keyName.replace("Digit", "") }));
        } else {
          keysDown[keyName] = true;
        }
      });

      el.addEventListener("touchend", (e) => {
        e.preventDefault();
        if (!isPressEvent) {
          keysDown[keyName] = false;
        }
      });
    }

    bindTouch("btn-up", "KeyW");
    bindTouch("btn-left", "KeyA");
    bindTouch("btn-right", "KeyD");
    bindTouch("btn-fire", "Space");

    const autoBtn = document.getElementById("btn-auto");
    if (autoBtn) {
      autoBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (myShip && myShip.has_autopilot && myShip.mana > 0 && myShip.alive) {
          myShip.autopilot_active = !myShip.autopilot_active;
        }
      });
    }

    bindTouch("btn-1", "Digit1", true);
    bindTouch("btn-2", "Digit2", true);
    bindTouch("btn-3", "Digit3", true);

    function getRotatedPoints(cx, cy, angle, size) {
      const rad = (angle * Math.PI) / 180;
      const tx = cx + size * Math.cos(rad);
      const ty = cy - size * Math.sin(rad);
      const lx = cx + size * 0.75 * Math.cos(rad + (140 * Math.PI) / 180);
      const ly = cy - size * 0.75 * Math.sin(rad + (140 * Math.PI) / 180);
      const rx = cx + size * 0.75 * Math.cos(rad - (140 * Math.PI) / 180);
      const ry = cy - size * 0.75 * Math.sin(rad - (140 * Math.PI) / 180);
      return [
        { x: tx, y: ty },
        { x: lx, y: ly },
        { x: rx, y: ry }
      ];
    }

    function drawPolygon(targetCtx, pts, fill = false, stroke = true) {
      targetCtx.beginPath();
      targetCtx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        targetCtx.lineTo(pts[i].x, pts[i].y);
      }
      targetCtx.closePath();
      if (fill) targetCtx.fill();
      if (stroke) targetCtx.stroke();
    }

    function drawOffscreenMarker(targetCtx, camX, camY, tx, ty, color) {
      const dx = tx - camX;
      const dy = ty - camY;
      if (dx === 0 && dy === 0) return;

      const pad = 26;
      const scaleX = dx !== 0 ? (V_WIDTH / 2 - pad) / Math.abs(dx) : Infinity;
      const scaleY = dy !== 0 ? (V_HEIGHT / 2 - pad) / Math.abs(dy) : Infinity;
      const s = Math.min(scaleX, scaleY);

      const ex = V_WIDTH / 2 + dx * s;
      const ey = V_HEIGHT / 2 + dy * s;
      const ang = Math.atan2(-dy, dx);
      const ms = 11;

      const pts = [
        { x: ex + ms * Math.cos(ang), y: ey - ms * Math.sin(ang) },
        { x: ex + ms * 0.8 * Math.cos(ang + 2.5), y: ey - ms * 0.8 * Math.sin(ang + 2.5) },
        { x: ex + ms * 0.8 * Math.cos(ang - 2.5), y: ey - ms * 0.8 * Math.sin(ang - 2.5) }
      ];

      targetCtx.fillStyle = color;
      targetCtx.strokeStyle = WHITE;
      targetCtx.lineWidth = 1;
      drawPolygon(targetCtx, pts, true, true);
    }

    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (inLobby) {
        updateLobby();
        renderLobby();
      } else {
        updateGame(dt);
        renderGame();
      }

      mouseClicked = false;

      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(virtualCanvas, 0, 0, canvas.width, canvas.height);

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    function updateLobby() {

            } else if (b.action === "host") {

            } else if (b.action === "join") {

            }
          }
        }
      } else if (menuMode === "host_private") {

            sendMsg({ action: "create_room", public: false, password: passwordInput || null });
            menuMode = "waiting";
            statusMessage = "Creating private arena...";
          }
          if (mousePos.x >= cx + 10 && mousePos.x <= cx + 140 && mousePos.y >= 340 && mousePos.y <= 382) {
            menuMode = "main";
          }
        }
      } else if (menuMode === "join_private") {
        if (mouseClicked) {
          if (mousePos.x >= cx - 140 && mousePos.x <= cx + 140 && mousePos.y >= 245 && mousePos.y <= 279) {
            activeInput = "code";
          } else if (mousePos.x >= cx - 140 && mousePos.x <= cx + 140 && mousePos.y >= 310 && mousePos.y <= 344) {
            activeInput = "pass";
          }
          if (mousePos.x >= cx - 140 && mousePos.x <= cx - 10 && mousePos.y >= 365 && mousePos.y <= 407 && roomCodeInput.length === 4) {
            connectWs();
            sendMsg({ action: "join_room", room_code: roomCodeInput, password: passwordInput || null });
            statusMessage = `Joining room [${roomCodeInput}]...`;
          }
          if (mousePos.x >= cx + 10 && mousePos.x <= cx + 140 && mousePos.y >= 365 && mousePos.y <= 407) {
            menuMode = "main";
          }
        }
      }
    }

    function updateGame(dt) {
      const newLocalLasers = [];
      let reportedDamageTarget = null;
      let reportedDamageAmount = 0;

      if (myShip.alive && myShip.hp <= 0) {
        myShip.alive = false;
        myShip.hp = 0;
        myShip.respawn_timer = 10.0;
        myShip.autopilot_active = false;
      }

      if (!myShip.alive) {
        myShip.respawn_timer -= dt;
        myShip.vx = 0;
        myShip.vy = 0;
        if (myShip.respawn_timer <= 0) {
          myShip.alive = true;
          myShip.hp = myShip.max_hp;
          myShip.world_x = -WORLD_BOUND * 0.5 + Math.random() * WORLD_BOUND;
          myShip.world_y = -WORLD_BOUND * 0.5 + Math.random() * WORLD_BOUND;
          myShip.vx = 0.0;
          myShip.vy = 0.0;
          myShip.mana = Math.max(0.0, myShip.mana - 30.0);
          myShip.respawn_timer = 0;
        }
      }

      if (myShip.cooldown > 0) {
        myShip.cooldown -= dt;
      }

      function emitShot(angDeg, offsetFwd, offsetSide) {
        if (!myShip.alive) return;
        const rAng = (angDeg * Math.PI) / 180;
        const perp = rAng + Math.PI / 2;
        const lx = myShip.world_x + offsetFwd * Math.cos(rAng) + offsetSide * Math.cos(perp);
        const ly = myShip.world_y - offsetFwd * Math.sin(rAng) - offsetSide * Math.sin(perp);
        const isMissileProj = Boolean(myShip.is_missile);
        const l = {
          x: lx,
          y: ly,
          angle: angDeg,
          owner: myId,
          dmg: myShip.shot_damage,
          pierce: Boolean(myShip.piercing),
          speed: myShip.laser_speed,
          is_missile: isMissileProj
        };
        lasers.push(l);
        newLocalLasers.push(l);
      }

      if (myShip.alive && myShip.has_autopilot && myShip.autopilot_active) {
        if (myShip.mana > 0) {
          myShip.mana = Math.max(0.0, myShip.mana - 14 * dt);
          let closestDist = Infinity;
          let targetPos = null;

          for (const pid in remoteShips) {
            const p = remoteShips[pid];
            if (!p || !p.alive || p.hp <= 0) continue;
            const d = Math.hypot(p.world_x - myShip.world_x, p.world_y - myShip.world_y);
            if (d < closestDist) {
              closestDist = d;
              targetPos = { x: p.world_x, y: p.world_y };
            }
          }

          if (targetPos) {
            const tDx = targetPos.x - myShip.world_x;
            const tDy = targetPos.y - myShip.world_y;
            const targetAng = ((Math.atan2(-tDy, tDx) * 180) / Math.PI + 360) % 360;
            const diff = ((targetAng - myShip.angle + 180) % 360) - 180;
            myShip.angle += Math.max(-myShip.rot_speed, Math.min(myShip.rot_speed, diff));

            const rad = (myShip.angle * Math.PI) / 180;
            const thrust = 0.06 * myShip.move_speed;
            myShip.vx += thrust * Math.cos(rad);
            myShip.vy -= thrust * Math.sin(rad);

            if (Math.abs(diff) < 16 && myShip.cooldown <= 0) {
              emitShot(myShip.angle, SHIP_SIZE, 0);
              myShip.cooldown = myShip.cooldown_max;
            }
          }
        } else {
          myShip.autopilot_active = false;
        }
      }

      if (myShip.alive && !myShip.autopilot_active) {
        let turn = 0;
        if (keysDown["KeyA"] || keysDown["ArrowLeft"]) turn += 1;
        if (keysDown["KeyD"] || keysDown["ArrowRight"]) turn -= 1;
        myShip.angle += turn * myShip.rot_speed;

        if (keysDown["KeyW"] || keysDown["ArrowUp"]) {
          const rad = (myShip.angle * Math.PI) / 180;
          const thrust = 0.065 * myShip.move_speed;
          myShip.vx += thrust * Math.cos(rad);
          myShip.vy -= thrust * Math.sin(rad);
        }

        if ((keysDown["Space"] || keysDown["KeyS"] || keysDown["ArrowDown"]) && myShip.cooldown <= 0) {
          const rad = (myShip.angle * Math.PI) / 180;

          if (myShip.cannons === 2) {
            emitShot(myShip.angle, SHIP_SIZE, 8);
            emitShot(myShip.angle, SHIP_SIZE, -8);
          } else {
            emitShot(myShip.angle, SHIP_SIZE, 0);
          }

          if (myShip.spread_shot) {
            emitShot((myShip.angle + 15) % 360, SHIP_SIZE, 0);
            emitShot((myShip.angle - 15) % 360, SHIP_SIZE, 0);
          }

          if (myShip.rear_cannon) {
            emitShot((myShip.angle + 180) % 360, SHIP_SIZE * 0.7, 0);
          }

          myShip.cooldown = myShip.cooldown_max;
          myShip.world_x -= 0.6 * Math.cos(rad);
          myShip.world_y += 0.6 * Math.sin(rad);
        }
      }

      if (myShip.alive) {
        myShip.vx *= 0.96;
        myShip.vy *= 0.96;
        myShip.world_x += myShip.vx;
        myShip.world_y += myShip.vy;

        const margin = SHIP_SIZE + 4;
        if (myShip.world_x < -WORLD_BOUND + margin) {
          myShip.world_x = -WORLD_BOUND + margin;
          myShip.vx = Math.abs(myShip.vx) * 0.8;
        } else if (myShip.world_x > WORLD_BOUND - margin) {
          myShip.world_x = WORLD_BOUND - margin;
          myShip.vx = -Math.abs(myShip.vx) * 0.8;
        }

        if (myShip.world_y < -WORLD_BOUND + margin) {
          myShip.world_y = -WORLD_BOUND + margin;
          myShip.vy = Math.abs(myShip.vy) * 0.8;
        } else if (myShip.world_y > WORLD_BOUND - margin) {
          myShip.world_y = WORLD_BOUND - margin;
          myShip.vy = -Math.abs(myShip.vy) * 0.8;
        }

        for (const a of asteroids) {
          const dx = myShip.world_x - a.x;
          const dy = myShip.world_y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = a.r + SHIP_SIZE - 2;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = minDist - dist;
            myShip.world_x += nx * overlap;
            myShip.world_y += ny * overlap;
            const bounce = 3.5 * myShip.ram_power;
            myShip.vx = nx * bounce;
            myShip.vy = ny * bounce;
          }
        }
      }

      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];

        if (l.is_missile) {
          let target = null;
          let minD = 900;
          if (Number(l.owner) === myId) {
            for (const pid in remoteShips) {
              const p = remoteShips[pid];
              if (!p || !p.alive || p.hp <= 0) continue;
              const d = Math.hypot(p.world_x - l.x, p.world_y - l.y);
              if (d < minD) {
                minD = d;
                target = p;
              }
            }
          } else if (myShip.alive && myShip.hp > 0) {
            const d = Math.hypot(myShip.world_x - l.x, myShip.world_y - l.y);
            if (d < minD) {
              target = myShip;
            }
          }

          if (target) {
            const targetAng = ((Math.atan2(-(target.world_y - l.y), target.world_x - l.x) * 180) / Math.PI + 360) % 360;
            const diff = ((targetAng - l.angle + 180) % 360) - 180;
            l.angle += Math.max(-5.5, Math.min(5.5, diff));
          }
        }

        const r = (l.angle * Math.PI) / 180;
        const spd = l.speed || 14.0;
        l.x += spd * Math.cos(r);
        l.y -= spd * Math.sin(r);

        if (
          Math.abs(l.x) > WORLD_BOUND ||
          Math.abs(l.y) > WORLD_BOUND ||
          Math.hypot(l.x - myShip.world_x, l.y - myShip.world_y) > 1700
        ) {
          lasers.splice(i, 1);
          continue;
        }

        let hitAst = false;
        const dmg = l.dmg || 1;
        for (let j = 0; j < asteroids.length; j++) {
          const a = asteroids[j];
          if (Math.hypot(l.x - a.x, l.y - a.y) < a.r) {
            a.hp -= dmg;
            hitAst = true;
            if (a.hp <= 0) {
              if (a.is_ore) {
                spawnOreCluster(a.x, a.y, 4 + Math.floor(Math.random() * 4));
              } else if (Math.random() < 0.25) {
                spawnOreCluster(a.x, a.y, 2 + Math.floor(Math.random() * 3));
              }

              Object.assign(a, createAsteroid(a.id));
            }
            break;
          }
        }

        if (hitAst) {
          if (!l.pierce) {
            lasers.splice(i, 1);
            continue;
          }
        }

        if (Number(l.owner) !== myId) {
          if (myShip.alive && myShip.hp > 0 && Math.hypot(l.x - myShip.world_x, l.y - myShip.world_y) < SHIP_SIZE + 6) {
            myShip.hp = Math.max(0, myShip.hp - (l.dmg || 1));
            lasers.splice(i, 1);
            if (myShip.hp <= 0) {
              myShip.alive = false;
              myShip.hp = 0;
              myShip.respawn_timer = 10.0;
              myShip.autopilot_active = false;
            }
            continue;
          }
        } else {
          let hitPlayer = false;
          for (const pid in remoteShips) {
            const p = remoteShips[pid];
            if (!p || !p.alive || p.hp <= 0) continue;
            if (Math.hypot(l.x - p.world_x, l.y - p.world_y) < SHIP_SIZE + 6) {
              p.hp = Math.max(0, p.hp - (l.dmg || 1));
              reportedDamageTarget = Number(p.id);
              reportedDamageAmount = l.dmg || 1;
              if (p.hp <= 0) {
                p.alive = false;
              }
              lasers.splice(i, 1);
              hitPlayer = true;
              break;
            }
          }
          if (hitPlayer) continue;
        }
      }

      for (const a of asteroids) {
        a.x += a.vx;
        a.y += a.vy;
        if (a.x < -WORLD_BOUND + a.r || a.x > WORLD_BOUND - a.r) a.vx *= -1;
        if (a.y < -WORLD_BOUND + a.r || a.y > WORLD_BOUND - a.r) a.vy *= -1;
      }

      if (myShip.alive) {
        for (let i = ores.length - 1; i >= 0; i--) {
          const o = ores[i];
          const d = Math.hypot(o.x - myShip.world_x, o.y - myShip.world_y);
          if (d < myShip.magnet_range) {
            o.x += (myShip.world_x - o.x) * myShip.orb_accel;
            o.y += (myShip.world_y - o.y) * myShip.orb_accel;
          }
          if (d < 24) {
            ores.splice(i, 1);
            myShip.mana = Math.min(myShip.max_mana, myShip.mana + 20.0 * myShip.mana_mult);
            myShip.xp += Math.floor(25 * myShip.xp_mult);
          }
        }
      }

      const outPayload = {
        ship: myShip,
        new_lasers: newLocalLasers
      };
      if (reportedDamageTarget !== null) {
        outPayload.hit_target = reportedDamageTarget;
        outPayload.dmg = reportedDamageAmount;
      }
      if (myId === 1) {
        outPayload.asteroids = asteroids;
        outPayload.ores = ores;
      }
      sendMsg({ action: "game_packet", payload: outPayload });
    }

    function renderGame() {
      const camX = myShip.world_x;
      const camY = myShip.world_y;
      const cx = V_WIDTH / 2;
      const cy = V_HEIGHT / 2;

      vctx.fillStyle = BLACK;
      vctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      const bLeft = Math.floor(-WORLD_BOUND - camX + cx);
      const bRight = Math.floor(WORLD_BOUND - camX + cx);
      const bTop = Math.floor(-WORLD_BOUND - camY + cy);
      const bBottom = Math.floor(WORLD_BOUND - camY + cy);

      vctx.strokeStyle = BORDER_COLOR;
      vctx.lineWidth = 3;
      vctx.strokeRect(bLeft, bTop, bRight - bLeft, bBottom - bTop);
      vctx.strokeStyle = "rgb(0, 70, 110)";
      vctx.lineWidth = 2;
      vctx.strokeRect(bLeft - 4, bTop - 4, bRight - bLeft + 8, bBottom - bTop + 8);

      for (const a of asteroids) {
        const ax = a.x - camX + cx;
        const ay = a.y - camY + cy;

        if (ax >= -60 && ax <= V_WIDTH + 60 && ay >= -60 && ay <= V_HEIGHT + 60) {
          vctx.fillStyle = a.is_ore ? ORE_ASTEROID_COLOR : ASTEROID_COLOR;
          vctx.beginPath();
          vctx.arc(ax, ay, a.r, 0, Math.PI * 2);
          vctx.fill();

          vctx.strokeStyle = a.is_ore ? ORE_BLUE : "rgb(85, 80, 95)";
          vctx.lineWidth = a.is_ore ? 3 : 2;
          vctx.stroke();

          if (a.is_ore) {
            vctx.fillStyle = ORE_BLUE;
            vctx.beginPath();
            vctx.arc(ax, ay, a.r * 0.35, 0, Math.PI * 2);
            vctx.fill();
            vctx.fillStyle = WHITE;
            vctx.beginPath();
            vctx.arc(ax, ay, a.r * 0.15, 0, Math.PI * 2);
            vctx.fill();
          }

          const barW = Math.floor(a.r * 1.5);
          const barH = 4;
          const bx = Math.floor(ax - barW / 2);
          const by = Math.floor(ay - a.r - 10);
          vctx.fillStyle = DARK_GRAY;
          vctx.fillRect(bx, by, barW, barH);
          const hpPct = Math.max(0.0, a.hp / (a.max_hp || 4));
          vctx.fillStyle = RAINBOW[4];
          vctx.fillRect(bx, by, Math.floor(barW * hpPct), barH);
        }
      }

      const pulse = Math.floor((performance.now() / 150) % 3);
      for (const o of ores) {
        const ox = o.x - camX + cx;
        const oy = o.y - camY + cy;

        if (ox >= -20 && ox <= V_WIDTH + 20 && oy >= -20 && oy <= V_HEIGHT + 20) {
          vctx.strokeStyle = "rgb(0, 100, 180)";
          vctx.lineWidth = 1;
          vctx.beginPath();
          vctx.arc(ox, oy, 6 + pulse, 0, Math.PI * 2);
          vctx.stroke();

          vctx.fillStyle = ORE_BLUE;
          vctx.beginPath();
          vctx.arc(ox, oy, 4, 0, Math.PI * 2);
          vctx.fill();

          vctx.fillStyle = WHITE;
          vctx.beginPath();
          vctx.arc(ox, oy, 2, 0, Math.PI * 2);
          vctx.fill();
        }
      }

      for (const l of lasers) {
        const lx = l.x - camX + cx;
        const ly = l.y - camY + cy;
        const rad = (l.angle * Math.PI) / 180;
        const lColor = RAINBOW[Number(l.owner)] || "rgb(255, 50, 50)";

        if (l.is_missile) {
          vctx.fillStyle = lColor;
          vctx.strokeStyle = WHITE;
          vctx.lineWidth = 1.5;
          vctx.beginPath();
          vctx.arc(lx, ly, 4.5, 0, Math.PI * 2);
          vctx.fill();
          vctx.stroke();

          vctx.strokeStyle = "rgb(255, 170, 40)";
          vctx.lineWidth = 2;
          vctx.beginPath();
          vctx.moveTo(lx, ly);
          vctx.lineTo(lx - 12 * Math.cos(rad), ly + 12 * Math.sin(rad));
          vctx.stroke();
        } else {
          vctx.strokeStyle = lColor;
          vctx.lineWidth = 3;
          vctx.beginPath();
          vctx.moveTo(lx, ly);
          vctx.lineTo(lx + 15 * Math.cos(rad), ly - 15 * Math.sin(rad));
          vctx.stroke();
        }
      }

      for (const pid in remoteShips) {
        const p = remoteShips[pid];
        if (!p || !p.alive || p.hp <= 0) continue;
        const ox = p.world_x - camX + cx;
        const oy = p.world_y - camY + cy;
        const rCol = RAINBOW[Number(p.id)] || RAINBOW[2];

        if (ox >= 0 && ox <= V_WIDTH && oy >= 0 && oy <= V_HEIGHT) {
          const pts = getRotatedPoints(ox, oy, p.angle, SHIP_SIZE);
          vctx.strokeStyle = rCol;
          vctx.lineWidth = 3;
          drawPolygon(vctx, pts, false, true);

          vctx.fillStyle = "rgb(255, 50, 50)";
          vctx.fillRect(ox - 17, oy - 28, 34, 5);
          const pct = Math.max(0.0, p.hp / (p.max_hp || 6));
          vctx.fillStyle = RAINBOW[4];
          vctx.fillRect(ox - 17, oy - 28, Math.floor(34 * pct), 5);
        } else {
          drawOffscreenMarker(vctx, camX, camY, p.world_x, p.world_y, rCol);
        }
      }

      if (myShip.alive && myShip.hp > 0) {
        const pts = getRotatedPoints(cx, cy, myShip.angle, SHIP_SIZE);
        vctx.strokeStyle = myShip.color;
        vctx.lineWidth = 3;
        drawPolygon(vctx, pts, false, true);

        if (myShip.autopilot_active) {
          vctx.strokeStyle = CYAN;
          vctx.lineWidth = 1;
          vctx.beginPath();
          vctx.arc(cx, cy, SHIP_SIZE + 6, 0, Math.PI * 2);
          vctx.stroke();
        }

        vctx.fillStyle = "rgb(255, 50, 50)";
        vctx.fillRect(cx - 17, cy - 28, 34, 5);
        const hpPct = Math.max(0.0, myShip.hp / myShip.max_hp);
        vctx.fillStyle = RAINBOW[4];
        vctx.fillRect(cx - 17, cy - 28, Math.floor(34 * hpPct), 5);
      } else {
        vctx.font = "bold 28px Consolas";
        vctx.fillStyle = RAINBOW[1];
        vctx.textAlign = "center";
        vctx.fillText("HULL DESTROYED", cx, cy - 15);
        vctx.font = "18px Consolas";
        vctx.fillStyle = WHITE;
        vctx.fillText(`RESPAWNING IN ${Math.max(1, Math.ceil(myShip.respawn_timer))}s`, cx, cy + 20);
      }

      const bm = 20;
      const by = 18;
      const bw = V_WIDTH - 40;
      const bh = 14;

      vctx.fillStyle = XP_BG;
      vctx.fillRect(bm, by, bw, bh);
      const prog = Math.min(1.0, myShip.xp / TIER_XP_THRESHOLDS[TIER_XP_THRESHOLDS.length - 1]);
      vctx.fillStyle = XP_BLUE;
      vctx.fillRect(bm, by, Math.floor(bw * prog), bh);
      vctx.strokeStyle = GRAY;
      vctx.lineWidth = 2;
      vctx.strokeRect(bm, by, bw, bh);

      const manaPct = myShip.mana / myShip.max_mana;
      vctx.fillStyle = XP_BG;
      vctx.fillRect(20, 42, 140, 8);
      vctx.fillStyle = CYAN;
      vctx.fillRect(20, 42, Math.floor(140 * manaPct), 8);

      const apLabel = !myShip.has_autopilot ? "LOCKED" : (myShip.autopilot_active ? "ACTIVE" : "STANDBY");
      vctx.font = "11px Consolas";
      vctx.textAlign = "left";
      vctx.fillStyle = myShip.autopilot_active ? CYAN : WHITE;
      vctx.fillText(`AUTOPILOT (E): ${apLabel}`, 20, 62);

      vctx.font = "12px Consolas";
      vctx.fillStyle = myShip.color;
      vctx.fillText(`PILOT ${myId}/6`, V_WIDTH - 245, 52);

      const nextReq = TIER_XP_THRESHOLDS[Math.min(5, myShip.tier + 1)];
      vctx.fillStyle = RAINBOW[3];
      vctx.fillText(`TIER ${myShip.tier}/5  XP: ${myShip.xp}/${nextReq}`, V_WIDTH - 150, 52);

      const currentNode = myShip.current_node;
      const options = UPGRADE_TREE[currentNode]?.children || [];
      const nextTier = myShip.tier + 1;

      if (options.length > 0 && nextTier < TIER_XP_THRESHOLDS.length && myShip.xp >= TIER_XP_THRESHOLDS[nextTier]) {
        drawCard(vctx, V_WIDTH / 2 - 275, 38, 550, 46, RAINBOW[4]);

        for (let i = 0; i < Math.min(options.length, 3); i++) {
          const optKey = options[i];
          const optData = UPGRADE_TREE[optKey];
          const txtStr = `[${i + 1}] ${optData.name}: ${optData.desc}`;
          vctx.font = "bold 11px Consolas";
          vctx.fillStyle = i === 0 ? WHITE : (i === 1 ? RAINBOW[3] : CYAN);
          vctx.fillText(txtStr, V_WIDTH / 2 - 265, 50 + i * 13);
        }
      }
    }
  </script>
